<svg xmlns="http://www.w3.org/2000/svg" width="760" height="684" viewBox="0 0 760 684" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="760" height="684" rx="10" fill="#2b2b2b"/>
<text x="28" y="42" fill="#e8e8e8" font-size="19" font-weight="600">Keyframe diamond — how to read it</text>
<text x="28" y="66" fill="#a8a8a8" font-size="13">Left half = which system (white transform, gold pose) · an empty quarter on the right = something is partial</text>
<rect x="20" y="96" width="720" height="54" rx="6" fill="#3a3a3a"/>
  <polygon points="56.0,110.0 56.0,123.0 43.0,123.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,123.0 56.0,136.0 43.0,123.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,110.0 69.0,123.0 56.0,123.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,123.0 69.0,123.0 56.0,136.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,110.0 69.0,123.0 56.0,136.0 43.0,123.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="92" y="119" fill="#e8e8e8" font-size="14" font-weight="600">Transform key</text>
<text x="92" y="137" fill="#a8a8a8" font-size="12.5">The column transform is keyed on every channel.</text>
<rect x="20" y="158" width="720" height="54" rx="6" fill="#3a3a3a"/>
  <polygon points="56.0,172.0 56.0,185.0 43.0,185.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,185.0 56.0,198.0 43.0,185.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,172.0 69.0,185.0 56.0,198.0 43.0,185.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="92" y="181" fill="#e8e8e8" font-size="14" font-weight="600">Partial transform key</text>
<text x="92" y="199" fill="#a8a8a8" font-size="12.5">Some transform channels are keyed, not all.</text>
<rect x="20" y="220" width="720" height="54" rx="6" fill="#3a3a3a"/>
  <polygon points="56.0,234.0 56.0,247.0 43.0,247.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,247.0 56.0,260.0 43.0,247.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,234.0 69.0,247.0 56.0,247.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,247.0 69.0,247.0 56.0,260.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,234.0 69.0,247.0 56.0,260.0 43.0,247.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="92" y="243" fill="#e8e8e8" font-size="14" font-weight="600">Full key — transform + pose</text>
<text x="92" y="261" fill="#a8a8a8" font-size="12.5">Everything is keyed: the whole character is locked here.</text>
<rect x="20" y="282" width="720" height="54" rx="6" fill="#3a3a3a"/>
  <polygon points="56.0,296.0 56.0,309.0 43.0,309.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,309.0 56.0,322.0 43.0,309.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,296.0 69.0,309.0 56.0,309.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,309.0 69.0,309.0 56.0,322.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,296.0 69.0,309.0 56.0,322.0 43.0,309.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="92" y="305" fill="#e8e8e8" font-size="14" font-weight="600">Pose key</text>
<text x="92" y="323" fill="#a8a8a8" font-size="12.5">The plastic pose is fully keyed, the transform not at all.</text>
<rect x="20" y="344" width="720" height="54" rx="6" fill="#3a3a3a"/>
  <polygon points="56.0,358.0 56.0,371.0 43.0,371.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,371.0 56.0,384.0 43.0,371.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,358.0 69.0,371.0 56.0,371.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,358.0 69.0,371.0 56.0,384.0 43.0,371.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="92" y="367" fill="#e8e8e8" font-size="14" font-weight="600">Full pose, partial transform</text>
<text x="92" y="385" fill="#a8a8a8" font-size="12.5">Global Key scope Plastic: the pose plus the channel you moved.</text>
<rect x="20" y="406" width="720" height="54" rx="6" fill="#3a3a3a"/>
  <polygon points="56.0,420.0 56.0,433.0 43.0,433.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,433.0 56.0,446.0 43.0,433.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,420.0 69.0,433.0 56.0,433.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,420.0 69.0,433.0 56.0,446.0 43.0,433.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="92" y="429" fill="#e8e8e8" font-size="14" font-weight="600">Full transform, partial pose</text>
<text x="92" y="447" fill="#a8a8a8" font-size="12.5">Global Key scope Stage: the transform plus the joints you moved.</text>
<rect x="20" y="468" width="720" height="54" rx="6" fill="#3a3a3a"/>
  <polygon points="56.0,482.0 56.0,495.0 43.0,495.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="56.0,495.0 56.0,508.0 43.0,495.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,482.0 69.0,495.0 56.0,508.0 43.0,495.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="92" y="491" fill="#e8e8e8" font-size="14" font-weight="600">Partial — transform + pose</text>
<text x="92" y="509" fill="#a8a8a8" font-size="12.5">Both systems hold a key, neither is complete.</text>
<rect x="20" y="530" width="720" height="54" rx="6" fill="#3a3a3a"/>
  <polygon points="56.0,544.0 56.0,557.0 43.0,557.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,557.0 56.0,570.0 43.0,557.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="56.0,544.0 69.0,557.0 56.0,570.0 43.0,557.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="92" y="553" fill="#e8e8e8" font-size="14" font-weight="600">Partial pose key</text>
<text x="92" y="571" fill="#a8a8a8" font-size="12.5">Some joints are keyed, the transform not at all.</text>
<text x="36" y="622" fill="#e8e8e8" font-size="13" font-weight="600">Same grammar in the viewer’s Set Key button</text>
  <polygon points="53.0,631.0 62.0,640.0 53.0,649.0 44.0,640.0" fill="none" stroke="#969696" stroke-width="1.2"/>
<text x="74" y="645" fill="#a8a8a8" font-size="12">no key</text>
<rect x="168" y="627" width="26" height="26" rx="3" fill="#B01E9A"/>
  <polygon points="181.0,631.0 181.0,640.0 172.0,640.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="181.0,640.0 181.0,649.0 172.0,640.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="181.0,631.0 190.0,640.0 181.0,649.0 172.0,640.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="202" y="645" fill="#a8a8a8" font-size="12">partial</text>
<rect x="296" y="627" width="26" height="26" rx="3" fill="#B01E9A"/>
  <polygon points="309.0,631.0 309.0,640.0 300.0,640.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="309.0,640.0 309.0,649.0 300.0,640.0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8"/>
  <polygon points="309.0,631.0 318.0,640.0 309.0,640.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="309.0,640.0 318.0,640.0 309.0,649.0" fill="#ECA61C" stroke="#ECA61C" stroke-width="0.8"/>
  <polygon points="309.0,631.0 318.0,640.0 309.0,649.0 300.0,640.0" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="330" y="645" fill="#a8a8a8" font-size="12">full</text>
<text x="430" y="645" fill="#a8a8a8" font-size="12">— magenta background = this frame holds a key</text>
</svg>
